{% extends "base.html" %}

{% block title %}Error - ERP System{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-body text-center">
                    <h1 class="display-1 text-danger">{{ error_code or "404" }}</h1>
                    <h2 class="mb-4">{{ error_message or "Page Not Found" }}</h2>
                    <p class="lead text-muted">
                        {{ error_description or "The page you are looking for could not be found." }}
                    </p>
                    <div class="mt-4">
                        <!-- FIXED: Use correct blueprint endpoint -->
                        <a href="{{ url_for('dashboard.dashboard') }}" class="btn btn-primary">
                            <i class="fas fa-home"></i> Back to Dashboard
                        </a>
                        <a href="javascript:history.back()" class="btn btn-outline-secondary">
                            <i class="fas fa-arrow-left"></i> Go Back
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
