<!DOCTYPE html>
<html>
<head>
    <title>Report Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h2>Report Generation Error</h2>
        <div class="alert alert-danger">
            <h4>Error:</h4>
            <p>{{ error_info.error }}</p>
        </div>
        
        <h4>Debug Information:</h4>
        <h5>Form Data:</h5>
        <pre>{{ error_info.form_data }}</pre>
        
        <h5>Full Traceback:</h5>
        <pre>{{ error_info.traceback }}</pre>
        
        <a href="/dashboard/dashboard" class="btn btn-primary">Back to Dashboard</a>
    </div>
</body>
</html>
