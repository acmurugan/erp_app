<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto-Generate RPT_PARAMS Configuration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h4><i class="fas fa-cogs me-2"></i>Auto-Generate RPT_PARAMS Configuration</h4>
                        <p class="mb-0 text-muted">Generate complete JSON configuration with all column names as defaults</p>
                    </div>
                    <div class="card-body">
                        <form id="generateForm">
                            <div class="mb-3">
                                <label for="reportId" class="form-label">Report ID</label>
                                <input type="text" class="form-control" id="reportId" placeholder="e.g., FIN001, TTL715" required>
                                <small class="form-text text-muted">Enter the report ID to generate configuration for</small>
                            </div>
                            
                            <div class="mb-3">
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-magic me-1"></i>Generate Configuration
                                </button>
                                <button type="button" class="btn btn-secondary ms-2" onclick="location.href='/reports'">
                                    <i class="fas fa-arrow-left me-1"></i>Back to Reports
                                </button>
                            </div>
                        </form>
                        
                        <!-- Results will be shown here -->
                        <div id="results" class="mt-4" style="display: none;">
                            <hr>
                            <h5>Generated Configuration:</h5>
                            <div class="row">
                                <div class="col-md-6">
                                    <h6>Column Headers (Editable)</h6>
                                    <div id="columnHeaders" class="border p-3" style="max-height: 400px; overflow-y: auto;">
                                        <!-- Column headers will be populated here -->
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <h6>Final JSON Configuration</h6>
                                    <textarea id="jsonOutput" class="form-control" rows="20" readonly></textarea>
                                </div>
                            </div>
                            
                            <div class="mt-3">
                                <button type="button" class="btn btn-success" onclick="updateDatabase()">
                                    <i class="fas fa-save me-1"></i>Update Database
                                </button>
                                <button type="button" class="btn btn-info ms-2" onclick="copyToClipboard()">
                                    <i class="fas fa-copy me-1"></i>Copy JSON
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentConfig = {};
        
        document.getElementById('generateForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const reportId = document.getElementById('reportId').value.trim().toUpperCase();
            if (!reportId) return;
            
            try {
                // Call backend to generate configuration
                const response = await fetch('/reports/admin/generate-config', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ report_id: reportId })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    currentConfig = result.config;
                    displayConfiguration(result.config);
                } else {
                    alert('Error: ' + result.error);
                }
                
            } catch (error) {
                alert('Error generating configuration: ' + error.message);
            }
        });
        
        function displayConfiguration(config) {
            // Show results section
            document.getElementById('results').style.display = 'block';
            
            // Populate column headers
            const headersDiv = document.getElementById('columnHeaders');
            headersDiv.innerHTML = '';
            
            Object.keys(config.column_headers || {}).forEach(column => {
                const div = document.createElement('div');
                div.className = 'mb-2';
                div.innerHTML = `
                    <div class="input-group input-group-sm">
                        <span class="input-group-text" style="min-width: 150px;">${column}</span>
                        <input type="text" class="form-control" value="${config.column_headers[column]}" 
                               onchange="updateColumnHeader('${column}', this.value)">
                    </div>
                `;
                headersDiv.appendChild(div);
            });
            
            // Update JSON output
            updateJsonOutput();
        }
        
        function updateColumnHeader(column, newValue) {
            if (!currentConfig.column_headers) currentConfig.column_headers = {};
            currentConfig.column_headers[column] = newValue;
            updateJsonOutput();
        }
        
        function updateJsonOutput() {
            document.getElementById('jsonOutput').value = JSON.stringify(currentConfig, null, 2);
        }
        
        async function updateDatabase() {
            const reportId = document.getElementById('reportId').value.trim().toUpperCase();
            
            try {
                const response = await fetch('/reports/admin/update-config', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        report_id: reportId,
                        config: currentConfig 
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    alert('Configuration updated successfully!');
                } else {
                    alert('Error updating database: ' + result.error);
                }
                
            } catch (error) {
                alert('Error updating database: ' + error.message);
            }
        }
        
        function copyToClipboard() {
            const textarea = document.getElementById('jsonOutput');
            textarea.select();
            document.execCommand('copy');
            alert('JSON copied to clipboard!');
        }
    </script>
</body>
</html>
